name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Every PR and push: verify the image builds. Never pushes.
  validate:
    name: build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: vpnui:validate
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publishes <DOCKERHUB_USERNAME>/vpnui for pushes to main, version tags
  # and manual runs. Skips cleanly (with a notice) while the Docker Hub
  # secrets are not configured.
  publish:
    name: publish to docker hub
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    env:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Docker Hub secrets
        id: check
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
            echo "Publishing to docker.io/$DH_USER/vpnui"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub secrets not configured — skipping publish. Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN as repository secrets, then re-run this workflow."
          fi

      - name: Set up buildx
        if: steps.check.outputs.has == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.check.outputs.has == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DH_USER }}
          password: ${{ env.DH_TOKEN }}

      - name: Image metadata
        if: steps.check.outputs.has == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DH_USER }}/vpnui
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        if: steps.check.outputs.has == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
